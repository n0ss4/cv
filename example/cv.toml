org = "Example University"
location = { en = "Valencia, Spain", es = "Valencia, España", ca = "València, Espanya" }
start = "2015"
end = "2019"
bullets = { en = "Final project: anomaly detection on sensor data (10/10).", es = "Trabajo final: detección de anomalías en datos de sensores (10/10).", ca = "Treball final: detecció d'anomalies en dades de sensors (10/10)." }

# Lines: a short label and value -- used here for awards and languages.
[[awards]]
label = "Example Datathon 2021"
value = { en = "First place", es = "Primer puesto", ca = "Primer lloc" }

