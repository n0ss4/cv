<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!--
		The privacy guarantee, enforced by the browser rather than promised:
		connect-src 'none' blocks every fetch, XHR, WebSocket and beacon, so the
		CV cannot leave the page even if a future change tried to send it.
		vite.config.ts fills this in; tests/build.test.ts fails if it weakens.
	-->
	<meta http-equiv="Content-Security-Policy" content="%CSP%">
	<meta name="referrer" content="no-referrer">
	<title>ATS Check</title>
	<meta name="description" content="See your CV the way an applicant tracking system does. Runs entirely in your browser; your file is never uploaded.">
	<meta name="color-scheme" content="light dark">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
	<div id="root"></div>
	<noscript>This checker runs in your browser and needs JavaScript. Nothing is uploaded.</noscript>
	<script type="module" src="/src/main.tsx"></script>
</body>
</html>
